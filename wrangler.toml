name = "ksta"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "kstastudio.com", custom_domain = true },
  { pattern = "www.kstastudio.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Datos publicos de Supabase (los mismos que ya usa la pagina)
